[project]
name = "gha-ci-detector"
version = "0.1.0"
description = "GitHub Actions CI/CD smell detector."
requires-python = ">=3.12"
dependencies = [
  "ruamel-yaml>=0.19.1",
  "tqdm>=4.67.3",
  "typer>=0.26.4",
  "yamllint>=1.38.0",
]

[project.scripts]
gha-ci-detector = "gha_ci_detector.__main__:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gha_ci_detector"]
