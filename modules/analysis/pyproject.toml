[project]
name = "analysis"
version = "0.1.0"
description = "Evaluation and analysis: loads raw agent runs and builds the paper's tables/figures."
requires-python = ">=3.12"
dependencies = [
  "gha-ci-detector",
  "matplotlib>=3.11.0",
  "numpy>=2.5.0",
  "pandas>=3.0.3",
  "pyyaml>=6.0.3",
  "scikit-learn>=1.9.0",
  "scipy>=1.18.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["utils"]
