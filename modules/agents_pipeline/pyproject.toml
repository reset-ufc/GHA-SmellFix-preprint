[project]
name = "gha-agents"
version = "0.1.0"
description = "Multi-agent pipeline that detects and refactors GitHub Actions CI/CD smells."
requires-python = ">=3.12"
dependencies = [
  "agno>=2.6.9",
  "anthropic>=0.105.2",
  "openai>=2.38.0",
  "google-genai>=2.7.0",
  "httpx[http2]>=0.28.1",
  "jsonschema>=4.26.0",
  "pydantic>=2.13.4",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "rich>=13.7.0",
  "typer>=0.26.4",
  "openpyxl>=3.1.5",
]

[project.scripts]
gha-smellfix = "gha_agents.cli:app"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gha_agents"]
